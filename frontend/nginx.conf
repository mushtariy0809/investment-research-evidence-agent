# Serve the built frontend and proxy API calls to the backend container —
# the same relative-URL setup the Vite dev proxy provides in development.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;  # research pipelines can take a while
    }

    location / {
        try_files $uri /index.html;
    }
}
